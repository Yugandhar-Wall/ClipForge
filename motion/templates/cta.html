<!doctype html>
<html data-composition-variables='[
 {"id":"text","type":"string","label":"Text","default":"WOULD YOU HAVE SURVIVED THAT?"},
 {"id":"y","type":"number","label":"Centre Y","default":420}
]'>
<head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.pill { position: relative; max-width: 900px; padding: 24px 40px 28px; background: #E61E2A; color: #fff; border-radius: 30px;
  text-align: center; text-transform: uppercase; line-height: 1.08; border: 7px solid #fff;
  box-shadow: 0 14px 0 rgba(0,0,0,.4); }
.bubble { position: absolute; right: -46px; top: -62px; font-size: 104px; line-height: 1; }
</style>
<script src="common.js"></script><script src="gsap.min.js"></script></head>
<body>
<div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-start="0" data-duration="1.3">
  <div class="center" id="wrap"><div class="pill" id="pill"><span id="t"></span><div class="bubble emoji" id="b">💬</div></div></div>
</div>
<script>
const V = CF.vars(), text = String(V.text || "").trim();
const pill = document.getElementById("pill"), b = document.getElementById("b");
document.getElementById("t").textContent = text;
pill.style.fontSize = CF.fit(text, [[18,78],[30,68],[44,60],[999,52]]) + "px";
document.getElementById("wrap").style.top = (V.y - pill.offsetHeight / 2) + "px";
const tl = gsap.timeline({ paused: true });
tl.fromTo(pill, { y: 120, scale: 0.4, opacity: 0, rotation: 4 }, { y: 0, scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "elastic.out(1, 0.55)" }, 0);
tl.fromTo(b, { scale: 0, rotation: -60 }, { scale: 1, rotation: 12, duration: 0.3, ease: "back.out(3)" }, 0.35);
tl.to(b, { rotation: -8, duration: 0.14, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0.66);
tl.to(b, { rotation: 6, duration: 0.1 }, 1.22);
CF.done(tl, 1.3);
</script>
</body></html>
