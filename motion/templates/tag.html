<!doctype html>
<html data-composition-variables='[
 {"id":"text","type":"string","label":"Name","default":"@KaiCenat"},
 {"id":"y","type":"number","label":"Centre Y","default":290}
]'>
<head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.tag { display: flex; align-items: center; gap: 16px; padding: 12px 30px 14px 18px; background: rgba(0,0,0,.72);
  border: 4px solid rgba(255,255,255,.9); border-radius: 50px; color: #fff; font-size: 46px; white-space: nowrap; }
.dot { width: 30px; height: 30px; border-radius: 50%; background: #FF2D3D; box-shadow: 0 0 0 6px rgba(255,45,61,.35); }
</style>
<script src="common.js"></script><script src="gsap.min.js"></script></head>
<body>
<div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-start="0" data-duration="0.9">
  <div class="center" id="wrap"><div class="tag" id="tag"><div class="dot" id="dot"></div><span id="t"></span></div></div>
</div>
<script>
const V = CF.vars(), tag = document.getElementById("tag");
document.getElementById("t").textContent = String(V.text || "");
document.getElementById("wrap").style.top = (V.y - tag.offsetHeight / 2) + "px";
const tl = gsap.timeline({ paused: true });
tl.fromTo(tag, { x: -700, opacity: 0, skewX: -12 }, { x: 0, opacity: 1, skewX: 0, duration: 0.45, ease: "power4.out" }, 0);
tl.fromTo("#dot", { scale: 0 }, { scale: 1.3, duration: 0.18, ease: "back.out(3)" }, 0.4);
tl.to("#dot", { scale: 1, duration: 0.15 }, 0.6);
CF.done(tl, 0.9);
</script>
</body></html>
